<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · First-party relay</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#14171c; --muted:#666e7a;
    --line:#e3e6ea; --accent:#2f5fe0; --bad:#b4232c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101317; --card:#171b21; --ink:#e8eaed; --muted:#98a1ad;
           --line:#262c34; --accent:#5b8cff; --bad:#ff6b6b; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;
        width:min(92vw,360px);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  h1{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}
  input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
        background:var(--bg);color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  button{width:100%;margin-top:20px;padding:10px;border:0;border-radius:7px;background:var(--accent);
         color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:14px;color:var(--bad);font-size:13px;min-height:19px}
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>First-party relay</h1>
    <p class="sub">Operations panel</p>
    <label for="u">User</label>
    <input id="u" name="user" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
<script>
const f=document.getElementById('f'),b=document.getElementById('b'),e=document.getElementById('e');
f.addEventListener('submit',async ev=>{
  ev.preventDefault(); e.textContent=''; b.disabled=true; b.textContent='Signing in…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:document.getElementById('u').value,password:document.getElementById('p').value})});
    if(r.ok){ location.href='/'; return; }
    e.textContent='Invalid credentials.';
  }catch(x){ e.textContent='Could not reach the panel.'; }
  b.disabled=false; b.textContent='Sign in';
});
</script>
</body>
</html>
