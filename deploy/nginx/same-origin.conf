# Same-origin mode (recommended)
#
# Add inside your site's existing HTTPS server block. The relay then lives on a path
# of your own domain, e.g. https://shop.example.com/metrics/
#
# Use the same path as FP_COLLECT_PREFIX (or collect_prefix in tenants.yml).
# Any unremarkable path works, for example /assets/m/ or /api/t/.

location /metrics/ {
    proxy_pass         http://127.0.0.1:8090;    # no URI: the path is passed through as-is

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;   # required for GA4 geolocation
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_pass_header  Set-Cookie;

    proxy_buffering    off;
    proxy_read_timeout 15s;
    client_max_body_size 256k;
}

# Optional: serve the tag loader from a path that looks like one of your assets.
# Must match loader_alias in tenants.yml.
