# Subdomain mode
#
# The relay gets its own hostname, e.g. https://metrics.example.com
# Requires a DNS record, a TLS certificate, and in .env (or tenants.yml):
#   FP_DEPLOYMENT_MODE=subdomain
#   FP_SITE_ORIGINS=https://example.com,https://www.example.com
#   FP_COLLECT_PREFIX=            (empty)
#
# Note: Safari can limit cookies set through a subdomain that resolves outside your
# site's own network to 7 days. Same-origin mode avoids this.

server {
    listen 443 ssl http2;
    server_name metrics.example.com;

    ssl_certificate     /etc/letsencrypt/live/metrics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.example.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_pass_header  Set-Cookie;

        # CORS headers are set by the relay. Do not add them here as well.

        proxy_buffering    off;
        proxy_read_timeout 15s;
        client_max_body_size 256k;
    }

    location /_t/ {
        proxy_pass       http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header       Cache-Control "no-store" always;
        add_header       X-Robots-Tag  "noindex, nofollow" always;
    }
}

server {
    listen 80;
    server_name metrics.example.com;
    return 301 https://$host$request_uri;
}
